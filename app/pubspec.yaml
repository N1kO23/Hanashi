name: hanashi
description: "Hanashi, a self-hostable chat app."
publish_to: 'none'
version: 1.0.4+1

resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  # Sticker pack files (see lib/data/packs/content_package.dart). The image
  # package depends on it too.
  archive: ^4.6.0
  cryptography: ^2.9.0
  # The desktop's global shortcuts (push to talk in every app, Linux).
  dbus: ^0.7.15
  # 0.9 needs cross_file 0.4, which file_picker and image_picker do not
  # support yet (see linux/runner/my_application.cc).
  desktop_drop: ^0.8.4
  # Android's API level, for a theme's notification sound (see
  # lib/notifications/notification_look.dart).
  device_info_plus: ^13.3.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  emoji_picker_flutter: ^4.5.4
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.3
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  hashlib: ^2.4.2
  html: ^0.15.7
  http: ^1.6.0
  image: ^4.12.0
  image_picker: ^1.2.4
  # Pinned: later versions download a prebuilt Rust library while building.
  livekit_client: 2.13.2
  # LiveKit's own pin, for screen sources and capture consent.
  flutter_webrtc: 1.6.3
  # Material widgets: package:flutter/material.dart's successor (Flutter 3.50).
  material_ui: ^1.11.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  mime: ^2.1.0
  hanashi_protocol:
    path: ../protocol
  open_filex: ^5.0.0
  openmls: 4.0.0
  # The app's Android package, whose FileProvider serves a theme's sounds.
  package_info_plus: ^10.2.2
  pasteboard: ^0.6.0
  path_provider: ^2.1.6
  # Built as SQLite3MultipleCiphers (see the workspace pubspec), which
  # encrypts the local database.
  sqlite3: ^3.8.0
  tray_manager: ^0.9.0
  # The app's icon in the taskbar and the dock, as the theme shown draws it
  # (lib/desktop/window_theme.dart); tray_manager and window_manager bring it.
  nativeapi: ^0.6.1
  # Android only (see lib/push/push_service.dart).
  unifiedpush_android: ^3.5.0
  unifiedpush_platform_interface: ^4.0.0
  url_launcher: ^6.3.3
  web_socket_channel: ^3.0.3
  window_manager: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.5.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/sounds/
    # The app's own license, shown with the others' (a copy of the
    # repository's LICENSE; test/about_test.dart sees that it stays one).
    - assets/LICENSE

# Generate with: dart run flutter_launcher_icons (its pictures are drawn by
# tool/make_default_icon.dart).
flutter_launcher_icons:
  image_path: branding/app_icon.png
  android: true
  adaptive_icon_background: "#2AA198"
  adaptive_icon_foreground: branding/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256
