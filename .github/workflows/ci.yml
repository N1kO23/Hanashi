# Tests every change (server, protocol, app, and the Linux desktop app end to
# end). Every push, and a run by hand, also builds the app for every platform
# and the server's Docker image, keeping the builds as workflow artifacts; a
# pull request builds only the image. A tag like v0.2.0 also publishes the
# builds as a GitHub release once the tests pass, and pushes the image.
#
# Android release signing uses these repository secrets when they are set:
#   ANDROID_KEYSTORE_BASE64    the .jks keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the APK is signed with a throwaway key, and installed copies
# cannot be updated by later builds.
#
# A tag also pushes the server's image to Docker Hub (DOCKER_IMAGE below) with
# this repository secret: DOCKERHUB_TOKEN, a Docker Hub access token that may
# read and write. Without it the image is built but not pushed.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.50.0
  # The MariaDB service of the test jobs (see server/internal/testdb).
  HANASHI_TEST_DSN: root:hanashi-test@tcp(127.0.0.1:3306)/
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  # The server's image on Docker Hub; the account it belongs to pushes it.
  DOCKER_IMAGE: n1ko23/hanashi-server

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb: &mariadb
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: hanashi-test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::Not gofmt-formatted: $unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...

  app-tests:
    name: App tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb: *mariadb
    steps:
      - uses: actions/checkout@v7
      # The tray's native library (nativeapi) is compiled for the tests too.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libgtk-3-dev libx11-dev libxi-dev
      # The sync tests build and run the real server.
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        # Lints too, not only warnings and errors.
        run: |
          (cd protocol && dart analyze --fatal-infos)
          (cd app && dart analyze --fatal-infos)
      - name: Dart formatting
        # All but generated code (drift's), at each package's width.
        run: |
          for package in protocol app; do
            (cd "$package" && git ls-files -z '*.dart' | grep -zv '\.g\.dart$' | xargs -0 dart format --output=none --set-exit-if-changed)
          done
      - name: Protocol tests
        working-directory: protocol
        run: dart test
      - name: App tests
        working-directory: app
        # Widgets, screenshots (goldens) and sync against the real server.
        run: flutter test
      - name: Keep the screenshots that differ
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: app/test/failures/
          if-no-files-found: ignore
          retention-days: 7

  desktop-tests:
    name: Desktop tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb: *mariadb
    steps:
      - uses: actions/checkout@v7
      - name: Install build and desktop dependencies
        # A virtual display, a window manager (the test maximizes the window),
        # a notification server, ffmpeg for test videos and audio, and
        # patchelf to package.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libmpv-dev libepoxy-dev libx11-dev libxi-dev libpipewire-0.3-dev xvfb openbox dunst \
            dbus-x11 ffmpeg patchelf
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: The real app end to end, and the desktop shell
        working-directory: app
        # One file per run: Flutter cannot start a second test app on Linux
        # within one `flutter test` run.
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" dbus-run-session -- bash -ec '
            openbox & dunst &
            sleep 2
            flutter test integration_test/app_e2e_test.dart -d linux
            flutter test integration_test/desktop_shell_test.dart -d linux
            flutter test integration_test/media_viewer_test.dart -d linux
          '
      - name: Media plays in the packaged app
        working-directory: app
        # The viewer test again, built as an app and packaged as the Linux
        # releases are, with their own libmpv: packaging mistakes (such as a
        # second libmpv from the system) only show there. The test app keeps
        # running after its tests, and need not quit on SIGTERM: a kill
        # follows.
        run: |
          flutter build linux --debug -t integration_test/media_viewer_test.dart
          out="$RUNNER_TEMP/viewer"
          ../packaging/linux/package.sh build/linux/x64/debug/bundle "$out" viewer-test 0.0.0
          tar -xzf "$out/viewer-test.tar.gz" -C "$out"
          xvfb-run -a -s "-screen 0 1600x1000x24" timeout -k 30 300 "$out/hanashi/hanashi" > "$out/log" 2>&1 || true
          cat "$out/log"
          grep -q 'All tests passed' "$out/log"

  # Not for pull requests; the builds need it, so they are skipped along with
  # it.
  version:
    name: Version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      number: ${{ steps.version.outputs.number }}
      label: ${{ steps.version.outputs.label }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Work out the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            label="$GITHUB_REF_NAME"
            name="${GITHUB_REF_NAME#v}"
          else
            name="$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)"
            label="$name-${GITHUB_SHA::7}"
          fi
          # Apple and Android version names must be plain numbers (0.2.0, not 0.2.0-beta.1).
          name="${name%%-*}"
          if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$name' is not like 1.2.3"
            exit 1
          fi
          {
            echo "name=$name"
            echo "number=$GITHUB_RUN_NUMBER"
            echo "label=$label"
          } >> "$GITHUB_OUTPUT"
          echo "Building $label (version $name, build $GITHUB_RUN_NUMBER)"

  android:
    name: Android
    needs: version
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      # Three CPU types of native code fill the runner's disk otherwise.
      # (Toolchains this job never uses; the Android SDK stays.)
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/checkout@v7
      # The Android Gradle plugin's lint (9.3) needs Java 21 to run; the app
      # itself is still compiled for Java 17 (app/android/app/build.gradle.kts).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: No release signing key
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway key and cannot update earlier installs."
      - name: Build
        working-directory: app
        # One APK per CPU type: a universal one is three times as large.
        # Phones are arm64-v8a; old phones armeabi-v7a; emulators x86_64.
        run: flutter build apk --release --split-per-abi --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
      - name: Package
        run: |
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app/build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/hanashi-${{ needs.version.outputs.label }}-android-$abi.apk"
          done
      # One artifact per file, downloaded as the file itself (not zipped).
      - uses: actions/upload-artifact@v7
        with:
          path: dist/hanashi-${{ needs.version.outputs.label }}-android-arm64-v8a.apk
          archive: false
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          path: dist/hanashi-${{ needs.version.outputs.label }}-android-armeabi-v7a.apk
          archive: false
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          path: dist/hanashi-${{ needs.version.outputs.label }}-android-x86_64.apk
          archive: false
          retention-days: 7

  linux:
    name: Linux
    needs: version
    # The oldest supported Ubuntu: the packages need at least the C library
    # they were built against.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        # PipeWire's headers for sharing screens and windows on Wayland
        # (app/linux/webrtc); the library itself is loaded at run time.
        # packaging/linux/Dockerfile installs the same for local builds.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libmpv-dev libepoxy-dev libx11-dev libxi-dev libpipewire-0.3-dev patchelf zsync
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Find the openmls package
        id: openmls
        run: |
          dir="$(jq -r '.packages[] | select(.name == "openmls") | .rootUri | sub("^file://"; "")' .dart_tool/package_config.json)"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "version=$(basename "$dir")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/openmls-target
          key: ${{ steps.openmls.outputs.version }}-ubuntu-22.04
      - name: Build openmls for this C library
        # Its published binary needs glibc 2.38; built here, it runs wherever
        # the rest of the app does. The openmls build hook prefers a library
        # in its rust/target/release/, and refuses one without the crate version
        # and lock file it was built from, which its `make build` leaves there.
        # (packaging/linux/container-build.sh does the same for local builds.)
        env:
          OPENMLS: ${{ steps.openmls.outputs.dir }}
        run: |
          export CARGO_TARGET_DIR="$HOME/openmls-target"
          rustup toolchain install stable --profile minimal
          cargo +stable build --release --locked --manifest-path "$OPENMLS/rust/Cargo.toml"
          mkdir -p "$OPENMLS/rust/target/release"
          cp "$CARGO_TARGET_DIR/release/libopenmls_frb.so" "$OPENMLS/rust/target/release/"
          sed -n 's/^version = "\([^"]*\)".*/\1/p;T;q' "$OPENMLS/rust/Cargo.toml" > "$OPENMLS/rust/target/release/.crate-version"
          cp "$OPENMLS/rust/Cargo.lock" "$OPENMLS/rust/target/release/.cargo-lock"
      - name: Build
        working-directory: app
        run: flutter build linux --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
      - name: Package
        env:
          NAME: hanashi-${{ needs.version.outputs.label }}-linux-x64
          # Releases tell AppImage updaters where newer versions are.
          UPDATE_INFO: ${{ startsWith(github.ref, 'refs/tags/v') && format('gh-releases-zsync|{0}|{1}|latest|hanashi-*-linux-x64.AppImage.zsync', github.repository_owner, github.event.repository.name) || '' }}
          DEB_HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          mkdir dist
          curl -sSfL -o "$RUNNER_TEMP/appimagetool" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" packaging/linux/package.sh app/build/linux/x64/release/bundle dist \
            "$NAME" "${{ needs.version.outputs.name }}+${{ needs.version.outputs.number }}" "$UPDATE_INFO"
      # One artifact per file, downloaded as the file itself (not zipped).
      - uses: actions/upload-artifact@v7
        with:
          path: dist/hanashi-${{ needs.version.outputs.label }}-linux-x64.AppImage
          archive: false
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: dist/hanashi-${{ needs.version.outputs.label }}-linux-x64.AppImage.zsync
          archive: false
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          path: dist/hanashi-${{ needs.version.outputs.label }}-linux-x64.deb
          archive: false
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          path: dist/hanashi-${{ needs.version.outputs.label }}-linux-x64.tar.gz
          archive: false
          retention-days: 7

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build and package
        # The installer and the .zip, as packaging/windows/build-installer.ps1
        # builds them on any Windows machine (it installs Inno Setup here if
        # the runner lacks it).
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.name }}
          NUMBER: ${{ needs.version.outputs.number }}
          NAME: hanashi-${{ needs.version.outputs.label }}-windows-x64
        run: ./packaging/windows/build-installer.ps1 -Version $env:VERSION -BuildNumber $env:NUMBER -Name $env:NAME
      # One artifact per file, downloaded as the file itself (not zipped).
      - uses: actions/upload-artifact@v7
        with:
          path: dist/hanashi-${{ needs.version.outputs.label }}-windows-x64-setup.exe
          archive: false
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          path: dist/hanashi-${{ needs.version.outputs.label }}-windows-x64.zip
          archive: false
          retention-days: 7

  macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: app
        run: flutter build macos --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
      - name: Package
        # Ad-hoc signed and not notarized. A disk image to drag into
        # Applications, and a zip of the app.
        run: |
          mkdir -p dist dmg
          app=app/build/macos/Build/Products/Release/Hanashi.app
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/hanashi-${{ needs.version.outputs.label }}-macos.zip"
          ditto "$app" dmg/Hanashi.app
          ln -s /Applications dmg/Applications
          # hdiutil now and then fails on CI runners ("Resource busy"): retry.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname Hanashi -srcfolder dmg -fs HFS+ -format UDZO \
              "dist/hanashi-${{ needs.version.outputs.label }}-macos.dmg" && break
            [[ $attempt == 5 ]] && exit 1
            sleep $((attempt * 5))
          done
      # One artifact per file, downloaded as the file itself (not zipped).
      - uses: actions/upload-artifact@v7
        with:
          path: dist/hanashi-${{ needs.version.outputs.label }}-macos.dmg
          archive: false
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          path: dist/hanashi-${{ needs.version.outputs.label }}-macos.zip
          archive: false
          retention-days: 7

  ios:
    name: iOS
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: app
        run: flutter build ios --release --no-codesign --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
      - name: Package
        # Unsigned: install with a sideloading tool that signs it (AltStore, Sideloadly).
        run: |
          mkdir -p dist ipa/Payload
          cp -R app/build/ios/iphoneos/Runner.app ipa/Payload/
          (cd ipa && zip -qry "../dist/hanashi-${{ needs.version.outputs.label }}-ios-unsigned.ipa" Payload)
      # One artifact per file, downloaded as the file itself (not zipped).
      - uses: actions/upload-artifact@v7
        with:
          path: dist/hanashi-${{ needs.version.outputs.label }}-ios-unsigned.ipa
          archive: false
          retention-days: 7

  # Also for pull requests, which change it too (Dependabot's base images).
  docker:
    name: Docker image
    needs: server-tests
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the versions
        # The image says the server's version (its Version constant), and
        # docker-compose.yml names the image of its own version: both must be
        # the release's. (Runs without a tag check them against
        # app/pubspec.yaml, so a mismatch shows before tagging.)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)"
          fi
          ok=true
          grep -qxF "const Version = \"$version\"" server/internal/api/api.go ||
            { echo "::error file=server/internal/api/api.go::The server's Version is not \"$version\""; ok=false; }
          grep -qxF "    image: $DOCKER_IMAGE:$version" docker-compose.yml ||
            { echo "::error file=docker-compose.yml::The hanashi service's image is not $DOCKER_IMAGE:$version"; ok=false; }
          $ok
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: No Docker Hub token
        if: env.DOCKERHUB_TOKEN == '' && startsWith(github.ref, 'refs/tags/v')
        run: echo "::warning::DOCKERHUB_TOKEN is not set; the image is built but not pushed."
      - name: Sign in to Docker Hub
        if: env.DOCKERHUB_TOKEN != '' && startsWith(github.ref, 'refs/tags/v')
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "${DOCKER_IMAGE%%/*}" --password-stdin
      - name: Build, and push for a tag
        # For both CPU types; arm64 is cross-compiled (see server/Dockerfile),
        # with no emulation. Runs without a tag only build them.
        run: |
          tags=(--tag "$DOCKER_IMAGE:$VERSION")
          # A pre-release (v1.2.0-beta.1) is not the latest.
          [[ "$VERSION" == *-* ]] || tags+=(--tag "$DOCKER_IMAGE:latest")
          push=()
          [[ "$GITHUB_REF" == refs/tags/v* && -n "$DOCKERHUB_TOKEN" ]] && push=(--push)
          docker buildx create --use --driver docker-container
          docker buildx build --platform linux/amd64,linux/arm64 --file server/Dockerfile \
            --build-arg VERSION="$VERSION" "${tags[@]}" "${push[@]}" .

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      [
        version,
        server-tests,
        app-tests,
        desktop-tests,
        docker,
        android,
        linux,
        windows,
        macos,
        ios,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # For CHANGELOG.md: the release's notes.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          pattern: hanashi-*
          path: dist
          merge-multiple: true
          # Each is the file itself; the Windows and macOS .zip files would
          # otherwise be unpacked into folders.
          skip-decompress: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=()
            [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
            # The version's section of CHANGELOG.md, without its heading;
            # GitHub's own notes for one it has none.
            notes="$(awk -v version="${TAG#v}" '
              index($0, "## [" version "]") == 1 { on = 1; next }
              on && /^## \[/ { exit }
              on && /^\[[^]]+\]: / { exit }
              on { print }
            ' CHANGELOG.md)"
            if [[ -n "${notes//[[:space:]]/}" ]]; then
              about=(--notes "$notes")
            else
              about=(--generate-notes)
            fi
            gh release create "$TAG" dist/* --title "Hanashi $TAG" "${about[@]}" --verify-tag "${prerelease[@]}"
          fi
